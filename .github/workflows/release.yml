name: Release

# Cut a Dune Weaver Touch release when a `v*` tag is pushed: build both panel
# images via tools/build_release.py (flat .bin images + manifest.json + a
# convenience zip) and publish them as GitHub Release assets.
#
# build_release.py refuses to finish unless tools/check_release.py passes on
# what it staged, and the last step re-runs that check on the copy committed to
# the default branch -- which is what the installer actually reads. v0.1.3
# published an image its manifest never mentioned; that cannot repeat silently.
#
#   git tag -a v0.1.1 -F notes.md
#   git push origin v0.1.1
#
# or trigger manually against an existing tag from the Actions tab.
#
# Ported from dune-weaver-firmware's release.yml, minus the one step that repo
# needs and this one does not: the unprefixed `firmware.bin` alias, which
# exists for the mobile app's table-OTA picker and has nothing to do with the
# panel.
#
# It DOES commit artifacts to the default branch, because the Dune Weaver
# installer now has a Touch panel section and reads releases/<tag>/ from this
# repo over raw.githubusercontent.com. That is not a preference: GitHub's
# release-asset downloads redirect to release-assets.githubusercontent.com,
# which sends no Access-Control-Allow-Origin, so a browser cannot fetch them.
# The cost is ~1.65 MB per release tracked forever (the .bin images and the
# manifest -- the convenience zip stays an asset only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags must be present: the dispatch fallback below and
                          # the annotated-tag re-fetch both need full history

      - name: Resolve the release tag
        run: |
          # The tag being released is the ref that TRIGGERED the run, not
          # whatever `git describe` picks: describe tie-breaks arbitrarily when a
          # commit carries more than one tag, and cutting a final release at the
          # same commit as its last RC does exactly that. The firmware repo
          # shipped a whole release under its RC's name that way.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(git describe --tags --abbrev=0)"
            echo "::notice::dispatched from ${{ github.ref_type }} '${{ github.ref_name }}'; falling back to $TAG"
          fi
          echo "DW_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          # ESP-IDF 5.5 + the xtensa toolchain is a slow first fetch, and the
          # managed components (LVGL 9, esp_lvgl_port, gt911, mdns) land under
          # the project, so cache the build dir's component cache too.
          path: |
            ~/.platformio
            ~/.espressif
          key: platformio-waveshare-5b-${{ runner.os }}-${{ hashFiles('platformio.ini', 'src/idf_component.yml') }}
          restore-keys: platformio-waveshare-5b-${{ runner.os }}-

      - name: Build release artifacts
        run: python3 tools/build_release.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same tag the build staged under release/<tag>/ (both read
          # DW_RELEASE_TAG), so the asset glob below cannot miss.
          TAG="$DW_RELEASE_TAG"

          # Release notes are the annotated tag's BODY -- everything after the
          # subject line. actions/checkout leaves the triggering tag as a
          # LIGHTWEIGHT ref pointing straight at the commit, and on a lightweight
          # tag %(contents:body) yields the COMMIT message body, which silently
          # published commit messages as release notes in the firmware repo
          # through v0.1.16. Re-fetch the real tag object and only trust the
          # annotation when the ref actually resolves to one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')"
          else
            echo "::warning::$TAG is not an annotated tag; falling back to generated notes"
            NOTES=""
          fi

          # A pre-release suffix (v0.1.1-rc1, v0.2.0-beta2) ships as a GitHub
          # PRE-RELEASE, so /releases/latest keeps pointing at the last final
          # release and an RC does not read as an update.
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease"
                 echo "$TAG has a pre-release suffix; publishing as a pre-release" ;;
          esac

          # `gh release create` FAILS if the release already exists, and that is
          # deliberate -- it is what caught the firmware repo publishing a final
          # release under its RC's tag. Do not soften it into an upsert.
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/relnotes.md"
            gh release create "$TAG" --title "$TAG" $PRERELEASE \
              --notes-file "$RUNNER_TEMP/relnotes.md" \
              "release/$TAG"/*
          else
            # --generate-notes only summarizes merged PRs, so for direct-to-main
            # commits it is a bare "Full Changelog" link. Always give the tag a
            # body; this is the last resort, not the plan.
            gh release create "$TAG" --title "$TAG" $PRERELEASE \
              --generate-notes \
              "release/$TAG"/*
          fi

      - name: Track artifacts on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer downloads the panel firmware from releases/<tag>/ on
          # the default branch (raw.githubusercontent.com/.../<branch>/...), NOT
          # from the GitHub Release assets: those redirect to a host that sends
          # no CORS header, so the browser's fetch is blocked before it starts.
          # Skip this and the installer's Touch section 404s on the manifest.
          #
          # release/<tag>/ is gitignored + untracked, so it survives the branch
          # checkout; we copy it into the tracked releases/<tag>/. The zip is
          # deliberately left behind -- nothing reads it from here, and it would
          # double what this repo grows by per release.
          #
          # NOTE: this step checks out the default BRANCH, where `git describe`
          # would answer with the branch's last tag rather than the one being
          # released -- another reason the tag is resolved once, up front.
          TAG="$DW_RELEASE_TAG"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p "releases/$TAG"
          cp -f "release/$TAG"/*.bin "release/$TAG/manifest.json" "releases/$TAG"/
          git add "releases/$TAG"
          if git diff --cached --quiet; then
            echo "artifacts already tracked; nothing to commit"
          else
            git commit -m "Track $TAG release artifacts"
            # one retry in case the branch advanced between fetch and push
            git push origin "HEAD:$BRANCH" || { git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; }
          fi

      - name: Verify the tracked release is installable
        run: |
          # The installer reads THIS copy, not the staged one build_release.py
          # already checked, and not the release assets. Re-check it here so a
          # dropped file in the cp above fails the run instead of 404ing in
          # someone's browser.
          python3 tools/check_release.py "releases/$DW_RELEASE_TAG"

      - name: Report what was published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release whose notes read like a commit message is the symptom of
          # the lightweight-tag trap above; surface it in the run summary rather
          # than leaving it to be noticed on the releases page.
          TAG="$DW_RELEASE_TAG"
          {
            echo "### Published \`$TAG\`"
            echo
            echo "| asset | bytes |"
            echo "|---|---|"
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "| \(.name) | \(.size) |"'
            echo
            echo "**Notes (first 5 lines):**"
            echo
            echo '```'
            gh release view "$TAG" --json body --jq .body | head -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
