; Dune Weaver Touch — ESP32-S3 firmware for the Waveshare ESP32-S3-Touch-LCD-5B
; (5" 1024x600 capacitive touch, ESP32-S3-WROOM-1-N16R8: 16MB quad flash, 8MB octal PSRAM)

[env:waveshare-5b]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; Native USB-Serial/JTAG port (UART0 is wired to the RS485 transceiver on this board)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_filters = esp32_exception_decoder
; Debug: add -DUI_DEBUG_TAB_CYCLE to auto-cycle tabs for crash reproduction
build_flags =
    ; Generated fonts (src/ui/fonts) include "lvgl.h" via this guard
    -DLV_LVGL_H_INCLUDE_SIMPLE
