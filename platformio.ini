; Dune Weaver Touch — ESP32-S3 firmware for the Waveshare ESP32-S3-Touch-LCD
; family (ESP32-S3-WROOM-1-N16R8: 16MB quad flash, 8MB octal PSRAM).
;
; Two panel variants, one tree. The boards share a base design — identical
; GPIO map, identical CH422G sequences — so the only difference is the panel
; resolution and RGB timings, selected by -DBOARD_WAVESHARE_7 in board.h:
;
;   pio run -e waveshare-5b   5" 1024x600  (default)
;   pio run -e waveshare-7    7" 800x480
;   pio run -e crowpanel-adv-5  Elecrow CrowPanel Advance 5.0 (own board file)
;   pio run -e crowpanel-7      Elecrow CrowPanel 7.0-HMI (own board file, 4 MB flash)
;
; Flash a specific board with -t upload, e.g.
;   pio run -e waveshare-7 -t upload
;
; Both boards expose the CONSOLE on the native USB-Serial/JTAG port. The 7 has
; a second Type-C port (next to the UART-select switch) on a CH343 bridge;
; it can flash, but it carries no console, and its auto-reset sometimes fails
; to enter download mode — hold BOOT while plugging in if esptool reports
; "No serial data received". upload_port globs /dev/cu.usbmodem*, which
; matches either, so unplug the one you do not mean to write.

[common]
platform = espressif32@6.12.0
framework = espidf
; IDF 5.5.2. The platform's own default is 5.5.0, which is the ONE version
; missing the fix for espressif/esp-idf#14000: SD mount dies with
; ESP_ERR_INVALID_CRC on the CMD52 probe after any reset that does not
; power-cycle the card -- the OTA reboot included. See tools/patch_idf_sdmmc.py.
platform_packages =
    platformio/framework-espidf@3.50502.0
    ; IDF 5.5.2 pins its toolchain by exact build date and refuses any other
    ; ("Tool doesn't match supported version from list ['esp-14.2.0_20251107']").
    ; The platform's own default is 14.2.0+20241119, so this must move with it.
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
; Belt and braces for the above: a no-op on 5.5.1+, patches an older framework
; rather than silently shipping a build whose card dies on the first reboot.
extra_scripts =
    pre:tools/patch_idf_sdmmc.py
    pre:tools/sdkconfig_env.py
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; Native USB-Serial/JTAG port (UART0 is wired to the RS485 transceiver on these boards)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_filters = esp32_exception_decoder
; Debug: add -DUI_DEBUG_TAB_CYCLE to auto-cycle tabs for crash reproduction
build_flags =
    ; Generated fonts (src/ui/fonts) include "lvgl.h" via this guard
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Uncomment for per-stage preview timings at INFO. ESP_LOGD is compiled out
    ; on device (CONFIG_LOG_MAXIMUM_LEVEL=3), so this is the ONLY way to see
    ; them here — which is how a 200 ms/tile redraw cost hid for a whole pass.
    ; -DPV_DEBUG_TIMING

[env:waveshare-5b]
extends = common
build_flags =
    ${common.build_flags}
    ; Panel held in LCD_RST while asleep (screen_sleep.c). STANDING PRACTICE on
    ; the 5B per Tuan 2026-08-28 — flash the 5B with this unless told otherwise.
    ; It is the live experiment against the white-halo artifact. Releases do NOT
    ; get it: tools/build_release.py builds waveshare-5b-release below, because
    ; the prototype is explicitly unmeasured ("the panel may or may not resume
    ; cleanly") and must not reach real panels. Drop both when it is settled.
    -DUI_DEBUG_RGB_STOP

[env:waveshare-5b-release]
; Identical to waveshare-5b MINUS the halo experiment. This is what ships.
extends = common

[env:waveshare-5]
; Waveshare ESP32-S3-Touch-LCD-5: 5", 800x480 — the same panel config as the 7
; (16 MHz, 8/8/4 porches, ~39 Hz, no flicker) at a 5" diagonal, so it gets the
; dark theme too. NOT the 5B, which is the 1024x600 variant.
;
; UNTESTED on hardware. It deliberately does NOT set BOARD_WAVESHARE_7: a 5"
; 800x480 panel is ~108 x 64.8 mm, i.e. 0.135 mm pixels in BOTH axes, so it
; needs no aspect correction. If circles come out taller than wide on a real
; one, that assumption is what to check first (theme.h TH_PX_ASPECT_X1000).
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_PANEL_800X480

[env:waveshare-7]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_PANEL_800X480
    ; 7" glass only: its pixels are 7.6% wider than tall (theme.h).
    -DBOARD_WAVESHARE_7

[env:crowpanel-adv-5]
; Elecrow CrowPanel Advance 5.0-HMI: 5" 800x480, ESP32-S3-WROOM-1-N16R8.
; Same panel geometry as the Waveshare 800x480 boards (so the whole UI carries
; over) but a completely different board: TCA9534/STC8 expander instead of the
; CH422G, its own pin map, and NO USB-Serial-JTAG -- GPIO19/20 are the I2S
; microphone, so the console goes out UART0 to the onboard CH340K.
;
; Pixels are square (no BOARD_WAVESHARE_7), the panel runs 21 MHz for ~51 Hz,
; and the Function Select DIP must be in the TF Card position or the SD card
; shares its pins with the speaker and never mounts.
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_PANEL_800X480
    -DBOARD_CROWPANEL_ADV_5
custom_sdkconfig =
    CONFIG_ESP_CONSOLE_UART_DEFAULT=y
    CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=n
    CONFIG_ESP_CONSOLE_UART_NUM=0

[env:crowpanel-7]
; Elecrow CrowPanel 7.0-HMI: the ORIGINAL 7" (DIS07070H), not the Advance
; series and not the Waveshare 7. 800x480 RGB on an ESP32-S3-WROOM-1-N4R8 --
; 4 MB flash, 8 MB octal PSRAM. A third board file, board_crowpanel7.c: its
; own RGB pin map (Elecrow's LovyanGFX config), backlight on GPIO2 as LEDC
; PWM (so sleep can dim), no IO expander at all, GT911 on I2C 19/20 with
; neither INT nor RST wired, TF card on SPI with a REAL chip select (GPIO10).
;
; Console is UART0 through the onboard CH340 (the only USB-C port), so pass
; the port explicitly: -t upload --upload-port /dev/cu.usbserial-XXXX, and
; pio device monitor --port /dev/cu.usbserial-XXXX. GPIO19/20 are the S3's
; USB pins, so the USB-Serial-JTAG peripheral is disabled outright
; (CONFIG_USJ_ENABLE_USB_SERIAL_JTAG=n): IDF then releases the USB pad at
; startup, which is what frees them for I2C.
;
; 4 MB flash means its own partition table (partitions-4mb.csv) and image
; header. Flashing ANY 16 MB env onto this board is a reboot loop at
; "spi_flash: Detected size(4096k) smaller than the size in the binary image
; header(16384k)", visible only on the UART console -- the ROM banner on the
; USB port just repeats "rst:0xc (RTC_SW_CPU_RST)" every 0.6 s.
;
; 7" 800x480 glass with the same pixel geometry as the Waveshare 7, hence
; BOARD_WAVESHARE_7 -- that flag means only "non-square pixels" (theme.h).
;
; NOT in tools/release_spec.py yet: it needs its own bootloader, partition
; table AND app image, and the spec has no per-board partition table.
extends = common
board_upload.flash_size = 4MB
board_build.partitions = partitions-4mb.csv
build_flags =
    ${common.build_flags}
    -DBOARD_PANEL_800X480
    -DBOARD_WAVESHARE_7
    -DBOARD_CROWPANEL_7
custom_sdkconfig =
    CONFIG_ESP_CONSOLE_UART_DEFAULT=y
    CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=n
    CONFIG_ESP_CONSOLE_UART_NUM=0
    ; No secondary console either: on the S3 that choice defaults to
    ; USB-Serial-JTAG, which keeps the USB pad on GPIO19/20 -- the touch I2C.
    CONFIG_ESP_CONSOLE_SECONDARY_NONE=y
    CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=n
    CONFIG_USJ_ENABLE_USB_SERIAL_JTAG=n
    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=n
    CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
